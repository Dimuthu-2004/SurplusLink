name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Restore, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Existing PostgreSQL fixtures create, migrate and drop disposable databases.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: surpluslink_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # This password belongs only to the temporary CI container.
      SURPLUSLINK_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=surpluslink_ci_only

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SurplusLink.sln

      - name: Build Release
        run: dotnet build SurplusLink.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test SurplusLink.sln --configuration Release --no-build --no-restore
